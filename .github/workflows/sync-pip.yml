name: Sync product catalog from PIP

# Pulls what PIP publishes for the website (LiveEdge /api/pip/web-export) and
# opens or updates a PR when app/data/pip/*.json changed. A night with no
# changes opens nothing. Secrets: WEBSITE_EXPORT_TOKEN (same value as in
# LiveEdge's Vercel env). See docs/agility-sync-plan.md.

on:
  schedule:
    - cron: "17 10 * * *" # 04:17 America/Chicago, after LiveEdge's nightly jobs
  workflow_dispatch:
    inputs:
      check_images:
        description: "Also HEAD every product image and fail on a dead one"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull the export
        env:
          LIVEEDGE_URL: https://app.beisser.cloud
          WEBSITE_EXPORT_TOKEN: ${{ secrets.WEBSITE_EXPORT_TOKEN }}
        run: node scripts/sync-pip.mjs ${{ inputs.check_images && '--check-images' || '' }}
      - name: Open or update the sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/pip-sync
          title: "Sync product catalog from PIP"
          commit-message: "Sync product catalog and literature from PIP"
          body: |
            Nightly pull of what PIP publishes for the website: `app/data/pip/catalog.json` (published `web:` guides) and `app/data/pip/literature.json` (vendor documents). Review the diff, then merge to deploy.
          labels: pip-sync
          delete-branch: true
